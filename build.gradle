buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net' }
        gradlePluginPortal()
    }
    dependencies {
        classpath "fabric-loom:fabric-loom.gradle.plugin:1.16.3"
    }
}

plugins {
    id 'java'
    id 'maven-publish'
}

apply plugin: 'fabric-loom'

group = 'com.ultra.hd4000'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net' }
    maven { url 'https://maven.modrinth.com' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    
    // Off-heap storage
    implementation "net.openhft:chronicle-map:3.25.4"
    implementation "org.agrona:agrona:1.18.0"
    
    // Compression
    implementation "com.github.luben:zstd-jni:1.5.6-4"
    
    // Profiling
    testImplementation "org.openjdk.jmh:jmh-core:1.37"
    testImplementation "org.openjdk.jmh:jmh-generator-annprocess:1.37"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "ultra-hd4000" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation" << "-parameters"
    options.release = 21
}

jar {
    manifest {
        attributes(
            "Fabric-Mod": "ultra-hd4000",
            "Main-Class": "com.ultra.hd4000.UltraHD4000Mod",
            "Mod-Version": project.version.toString(),
            "Minecraft-Version": project.minecraft_version
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(configurations.runtimeClasspath.filter { it.name.endsWith(".so") || it.name.endsWith(".dll") || it.name.endsWith(".dylib") }) {
        into("lib")
    }
}